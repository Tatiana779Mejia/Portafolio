<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingrid Marin | Portfolio</title>
<meta name="description" content="Personal portfolio: projects, tech stack, certificates and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav aria-label="Main">
  <a class="logo script" href="#home" id="navLogo">Portfolio</a>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#stack">Tech Stack</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#certificates">Certificates</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- 1. HOME / PROFILE -->
<header class="sheet" id="home">
  <span class="ghost script" aria-hidden="true" id="ghost">I</span>
  <div class="hero" style="position:relative">
    <div class="avatar script" id="avatar" aria-label="Profile picture"></div>
    <div>
      <h1 id="fullName"></h1>
      <span class="headline" id="titleLine"></span>
      <p id="about"></p>
      <div class="social" id="social"></div>
    </div>
  </div>
  <div class="facts" id="facts"></div>
</header>

<!-- 2. TECH STACK -->
<section class="sheet" id="stack">
  <h2>Tech Stack &amp; Tools</h2>
  <div class="grid" id="stackGrid"></div>
</section>

<!-- 3. PROJECTS -->
<section class="sheet" id="projects">
  <h2>Featured Projects</h2>
  <div id="projectList"></div>

  <p class="sub">Extra projects</p>
  <div id="extraProjectList"></div>
</section>

<!-- 4. CERTIFICATES -->
<section class="sheet" id="certificates">
  <h2>Education &amp; Certificates</h2>
  <p class="sub" style="margin-top:0">Module courses</p>
  <div class="grid" id="requiredCerts"></div>
  <p class="sub">Additional certificates</p>
  <div class="grid" id="extraCerts"></div>
</section>

<!-- 5. CONTACT -->
<section class="sheet" id="contact">
  <h2>Let's work together</h2>
  <div class="contact">
    <form id="contactForm" novalidate>
      <label>Name<input type="text" name="name" required autocomplete="name"></label>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Message<textarea name="message" required></textarea></label>
      <button class="btn dark" type="submit">Send message</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <div class="direct" id="direct"></div>
  </div>
</section>

<footer id="footer"></footer>

<script src="script.js"></script>
</body>
</html>
